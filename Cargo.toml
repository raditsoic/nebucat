[workspace]
members = ["crates/nebucat-core", "crates/nebucat"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

# gpui-kit installation guide: debug UI is unusably slow without these.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
strip = true
